[package]
name = "zen-home"
version = "0.5.0"
description = "Installe Zen Home sur une Xiaomi Mi Box 4"
authors = ["Tetrax"]
edition = "2024"

[lib]
# Le suffixe _lib évite un conflit de nom avec le binaire (problème connu sous Windows,
# voir https://github.com/rust-lang/cargo/issues/8519).
name = "zen_home_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zh-reseau = { path = "../crates/reseau" }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
